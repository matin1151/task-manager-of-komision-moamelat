<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دستیار کمیسیون معاملات | متین</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
  --navy:#0f3558; --navy2:#123f68; --blue:#1767a9; --gold:#c9972b;
  --gold2:#e3bb63; --gold-soft:#f7ecd1; --cream:#fbf8f1;
  --bg:#f4f1e9; --card:#fffdf9; --text:#152b40; --muted:#728092;
  --teal:#159b78; --red:#d84c4c; --orange:#e7952f; --purple:#7657cf;
  --line:#e9e2d5; --shadow:0 10px 34px rgba(25,52,76,.08);
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 7% 12%,rgba(225,186,92,.13),transparent 24%),
    radial-gradient(circle at 88% 48%,rgba(225,186,92,.08),transparent 28%),
    linear-gradient(135deg,#f8f6ef,#f1eee5);
  color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px;line-height:1.8;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{display:flex;min-height:100vh;position:relative;overflow:hidden}

/* Right navigation */
.side{
  width:250px;background:linear-gradient(180deg,#0c3152,#0e3b62 65%,#0b304f);
  color:#fff;padding:20px 14px;position:fixed;right:0;top:0;bottom:0;z-index:5;
  box-shadow:-10px 0 35px rgba(12,49,82,.12);
}
.side:after{
  content:"";position:absolute;inset:auto 8px 20px 8px;height:250px;opacity:.11;
  background:
    radial-gradient(ellipse at 60% 20%,#e6c16a 0 7%,transparent 8%),
    radial-gradient(ellipse at 42% 34%,#e6c16a 0 8%,transparent 9%),
    radial-gradient(ellipse at 72% 48%,#e6c16a 0 7%,transparent 8%);
  filter:blur(1px);pointer-events:none;
}
.brand{font-size:20px;font-weight:800;padding:7px 12px 23px;position:relative;z-index:1}
.brand small{display:block;font-size:12px;opacity:.65;margin-top:3px;font-weight:500}
.nav{position:relative;z-index:1}
.nav button{
  width:100%;background:transparent;color:#dce8f4;text-align:right;padding:13px 13px;
  border-radius:11px;margin:3px 0;font-size:15px;font-weight:600;transition:.18s;
}
.nav button.active,.nav button:hover{
  background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(225,185,88,.34));
  color:#fff;box-shadow:inset -3px 0 0 var(--gold2);
}
.main{margin-right:250px;width:calc(100% - 250px);padding:24px 34px 35px;position:relative}
.main:before,.main:after{
  content:"";position:absolute;pointer-events:none;z-index:0;opacity:.48;
}
.main:before{
  left:-90px;top:55px;width:300px;height:520px;
  background:
    radial-gradient(ellipse at 58% 18%,rgba(206,160,49,.25) 0 5%,transparent 6%),
    radial-gradient(ellipse at 40% 31%,rgba(206,160,49,.22) 0 6%,transparent 7%),
    radial-gradient(ellipse at 66% 45%,rgba(206,160,49,.20) 0 7%,transparent 8%),
    linear-gradient(72deg,transparent 44%,rgba(206,160,49,.22) 45%,rgba(206,160,49,.06) 47%,transparent 49%);
  filter:blur(.2px);
}
.main:after{
  right:245px;top:70px;width:220px;height:260px;
  background:
    radial-gradient(ellipse at 65% 35%,rgba(206,160,49,.14),transparent 48%),
    radial-gradient(ellipse at 35% 70%,rgba(206,160,49,.11),transparent 45%);
  filter:blur(18px);
}
.top,.cards,.layout,.panel{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.top h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.3px}
.date{color:var(--muted);font-size:13px}
.actions{display:flex;gap:9px;align-items:center}
.btn{
  padding:10px 16px;border-radius:10px;background:#fffdf9;border:1px solid var(--line);
  color:var(--navy);font-weight:700;font-size:14px;box-shadow:0 2px 9px rgba(20,44,66,.03);
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.green{background:var(--teal);color:#fff}
.search{
  border:1px solid #e2dccf;border-radius:11px;padding:10px 13px;width:260px;
  background:rgba(255,255,255,.82);color:var(--text);outline:none
}
.search:focus{border-color:var(--gold)}

.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
.card{
  background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:16px;
  padding:17px;box-shadow:var(--shadow);min-height:92px;cursor:pointer;transition:.18s
}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(25,52,76,.12);border-color:#d8c58e}
.card:focus{outline:2px solid var(--gold);outline-offset:2px}
.card .n{font-size:29px;font-weight:800;line-height:1.2}
.card small{color:#68798a;font-size:13px;font-weight:600}
.card:nth-child(1){border-top:3px solid #9b9da1}
.card:nth-child(2){border-top:3px solid var(--purple)}
.card:nth-child(3){border-top:3px solid var(--blue)}
.card:nth-child(4){border-top:3px solid var(--red)}
.card:nth-child(5){border-top:3px solid var(--teal)}

.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
.panel{
  background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:20px
}
.panel h2{font-size:20px;margin:0 0 16px;font-weight:800}

.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eee9df}
.task:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.red{background:var(--red)}.orange{background:var(--orange)}.yellow{background:#d4a62e}.blue{background:var(--blue)}
.task b{font-size:15px}.task span{display:block;color:var(--muted);font-size:13px}
.tx{
  display:grid;grid-template-columns:1.25fr .8fr .8fr .8fr auto;align-items:center;
  gap:12px;padding:15px 0;border-bottom:1px solid #eee9df;font-size:14px
}
.tx:last-child{border:0}
.tx b{white-space:normal;word-spacing:.08em;overflow-wrap:anywhere;line-height:1.8}
.tx span{color:var(--muted)}
.tx > div > span{display:block;margin-top:3px}
.badge{
  font-size:12px;padding:5px 10px;border-radius:999px;background:#eef5fb;
  color:var(--blue);white-space:nowrap;font-weight:700
}
.empty{padding:35px;text-align:center;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(9,25,40,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.dialog{
  background:#fffdf9;border-radius:20px;width:min(780px,100%);max-height:90vh;overflow:auto;
  padding:25px;border:1px solid var(--line);box-shadow:0 25px 80px rgba(0,0,0,.18)
}
.dialog h2{margin-top:0;font-size:24px}
.close{float:left;background:#f1eee7;padding:7px 11px;border-radius:9px;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{margin-bottom:13px}
.field label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #ded8ca;border-radius:10px;padding:11px;background:#fff;
  color:var(--text);outline:none
}
.field input:focus,.field select:focus{border-color:var(--gold)}

.workflow{margin-top:17px}
.stage{border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden;background:#fff}
.stagehead{
  padding:13px 15px;background:linear-gradient(90deg,#fbfaf6,#f4f7fa);
  display:flex;justify-content:space-between;align-items:center
}
.stagehead strong{font-size:15px}.progress{font-size:13px;color:var(--muted)}
.stagehead{cursor:pointer;user-select:none}.stagehead:hover{background:#eef4f8}.stage-chevron{font-size:18px;color:var(--navy);width:24px;text-align:center}.stagehead-main{display:flex;align-items:center;gap:8px}.stage-body{display:none}.stage.open .stage-body{display:block}.stage.complete .stagehead{background:linear-gradient(90deg,#edf8f2,#f4f7fa)}
.sub{padding:9px 15px;display:flex;gap:10px;align-items:center;font-size:14px;border-top:1px solid #f1eee8}
.sub input{accent-color:var(--teal);width:16px;height:16px}
.toast{position:fixed;bottom:22px;left:22px;background:var(--navy);color:#fff;padding:12px 17px;border-radius:11px;display:none;z-index:20;box-shadow:var(--shadow)}
.mobile-nav{display:none}

/* Dashboard visual helpers */
.dashboard-hero{
  min-height:170px;border-radius:18px;border:1px solid var(--line);background:
  linear-gradient(110deg,rgba(255,253,249,.96),rgba(250,246,234,.92));
  padding:20px;position:relative;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)
}
.dashboard-hero:after{
  content:"";position:absolute;left:-15px;bottom:-55px;width:280px;height:210px;
  background:
   radial-gradient(ellipse at 65% 30%,rgba(201,151,43,.30) 0 5%,transparent 6%),
   radial-gradient(ellipse at 42% 52%,rgba(201,151,43,.23) 0 7%,transparent 8%),
   radial-gradient(ellipse at 73% 70%,rgba(201,151,43,.19) 0 6%,transparent 7%),
   linear-gradient(25deg,transparent 46%,rgba(201,151,43,.28) 47%,transparent 49%);
  transform:rotate(-8deg);opacity:.85
}
.hero-title{font-size:23px;font-weight:800;position:relative;z-index:1}
.hero-sub{color:var(--muted);position:relative;z-index:1;font-size:14px}
.routine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;position:relative;z-index:1}
.routine{
  border:1px solid transparent;border-radius:14px;padding:14px;text-align:center;font-weight:700;
  min-height:92px;display:flex;align-items:center;justify-content:center;transition:.18s
}
.routine{white-space:normal;word-spacing:.08em;overflow-wrap:anywhere;line-height:1.8}
.routine:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(25,52,76,.08)}
.r1{background:#edf8f6;color:#137f69}.r2{background:#fff3e4;color:#a66513}.r3{background:#f2edff;color:#6344b8}
.r4{background:#edf5fd;color:#1767a9}.r5{background:#eef8ed;color:#27814e}.r6{background:#eaf5ff;color:#1877bd}
.r7{background:#fff0ee;color:#c4443d}.r8{background:#fff7e8;color:#ad7914}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .routine-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:950px){
  .side{display:none}.main{margin:0;width:100%;padding:18px 14px 82px}
  .cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}
  .tx{grid-template-columns:1fr auto}.tx>*:nth-child(n+3){display:none}
  .grid2{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}
  .search{width:180px}.routine-grid{grid-template-columns:repeat(2,1fr)}
  .mobile-nav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fffdf9;border-top:1px solid var(--line);z-index:6}
  .mobile-nav button{flex:1;padding:11px;background:#fffdf9;color:var(--muted);font-size:12px}
}
@media(max-width:560px){
  .cards{grid-template-columns:1fr 1fr}.top{display:block}.actions{margin-top:10px}
  .search{width:100%}.actions .btn{flex:1}.routine-grid{grid-template-columns:1fr 1fr}
}

.jalali-input-wrap{position:relative;display:flex;align-items:center}
.jalali-input-wrap input{padding-left:48px!important;cursor:pointer;background:#fff}
.calendar-btn{position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:9px;background:var(--gold-soft);color:var(--navy);font-size:18px}
.jalali-picker{position:relative;margin-top:7px;width:100%;background:#fffdf9;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px rgba(15,53,88,.16);padding:13px;z-index:20}
.jp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.jp-title{text-align:center;font-weight:800;color:var(--navy);font-size:15px}
.jp-nav{width:32px;height:32px;border-radius:8px;background:#f3efe5;color:var(--navy);font-weight:800}
.jp-week,.jp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.jp-week div{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:3px}
.jp-day{height:34px;border-radius:8px;background:#fff;border:1px solid transparent;color:var(--text);font-size:12px}
.jp-day:hover{background:var(--gold-soft);border-color:var(--gold2)}
.jp-day.today{border-color:var(--gold);font-weight:800}
.jp-day.selected{background:var(--navy);color:#fff}
.jp-day.empty{visibility:hidden}
.jp-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.jp-today{font-size:11px;color:var(--blue);font-weight:800}
.jp-close{font-size:11px;color:var(--muted);background:transparent}

/* V12 calendar: isolated styles so no generic button/grid rules can break it */
#jalaliPicker.jalali-picker{
  position:absolute !important;
  right:0 !important;
  top:calc(100% + 6px) !important;
  width:230px !important;
  margin:0 !important;
  padding:0 !important;
  box-sizing:border-box !important;
  display:none;
  overflow:hidden !important;
  z-index:9999 !important;
  background:#fffdf8 !important;
  border:1px solid #8fb4cc !important;
  border-radius:7px !important;
  box-shadow:0 9px 22px rgba(17,58,88,.25) !important;
}
#jalaliPicker .v12-head{
  height:36px !important;
  display:grid !important;
  grid-template-columns:32px 1fr 32px !important;
  align-items:center !important;
  background:#438fbc !important;
  color:white !important;
}
#jalaliPicker .v12-title{
  text-align:center !important;
  font-size:13px !important;
  font-weight:800 !important;
}
#jalaliPicker .v12-nav{
  width:25px !important;height:25px !important;
  margin:auto !important;padding:0 !important;
  border:0 !important;border-radius:6px !important;
  background:#f4f7f8 !important;color:#23485f !important;
  font-size:18px !important;line-height:22px !important;
  cursor:pointer !important;
}
#jalaliPicker .v12-selects{
  display:grid !important;
  grid-template-columns:1fr 1fr !important;
  gap:4px !important;
  padding:4px 6px !important;
  background:#5ca0c8 !important;
}
#jalaliPicker .v12-select{
  width:100% !important;height:27px !important;
  padding:0 5px !important;
  box-sizing:border-box !important;
  border:1px solid #b9d3e3 !important;
  border-radius:6px !important;
  background:#fff !important;color:#29475a !important;
  font:700 11px Tahoma,Vazirmatn,sans-serif !important;
  outline:none !important;
}
#jalaliPicker .v12-week{
  display:grid !important;
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  gap:0 !important;
  width:100% !important;
  box-sizing:border-box !important;
  background:#edf5f9 !important;
  border-bottom:1px solid #c8d8e2 !important;
}
#jalaliPicker .v12-week span{
  display:block !important;
  height:24px !important;
  line-height:24px !important;
  padding:0 !important;
  text-align:center !important;
  font:700 9px/24px Tahoma,Vazirmatn,sans-serif !important;
  color:#274457 !important;
}
#jalaliPicker .v12-grid{
  display:grid !important;
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  grid-auto-rows:27px !important;
  gap:0 !important;
  width:100% !important;
  box-sizing:border-box !important;
  background:#fff !important;
}
#jalaliPicker .v12-day{
  width:100% !important;
  height:27px !important;
  min-width:0 !important;
  margin:0 !important;
  padding:0 !important;
  box-sizing:border-box !important;
  border:0 !important;
  border-left:1px solid #edf0f2 !important;
  border-bottom:1px solid #edf0f2 !important;
  border-radius:0 !important;
  background:#fff !important;
  color:#263f51 !important;
  font:italic 11px/27px Tahoma,Vazirmatn,sans-serif !important;
  text-align:center !important;
  cursor:pointer !important;
}
#jalaliPicker .v12-day:hover{background:#f7e7ae !important}
#jalaliPicker .v12-day.v12-empty{
  background:#fafbfc !important;
  cursor:default !important;
}
#jalaliPicker .v12-day.v12-today{
  background:#4d98c7 !important;color:#fff !important;font-weight:800 !important;
}
#jalaliPicker .v12-day.v12-selected{
  background:#edc73d !important;color:#263746 !important;font-weight:900 !important;
}
#jalaliPicker .v12-day.v12-today.v12-selected{
  background:#edc73d !important;color:#263746 !important;
}
#jalaliPicker .v12-footer{
  height:27px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:flex-end !important;
  padding:0 7px !important;
  box-sizing:border-box !important;
  background:#edf4f8 !important;
  border-top:1px solid #c7d7e0 !important;
}
#jalaliPicker .v12-close{
  border:0 !important;background:transparent !important;
  color:#31536a !important;font:700 10px Tahoma,Vazirmatn,sans-serif !important;
  cursor:pointer !important;
}
.date-field{position:relative!important}
/* V21 — keep the calendar beside the suggested-date window, not below it */
.date-tools-row{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;align-items:start;margin-top:7px}
.date-tools-row .date-suggestion-box{margin-top:0}
.date-tools-row .jalali-picker{position:relative!important;margin-top:0!important;width:250px!important;box-sizing:border-box!important}
@media (max-width:820px){.date-tools-row{grid-template-columns:minmax(0,1fr) 220px}.date-tools-row .jalali-picker{width:220px!important}}
@media (max-width:650px){.date-tools-row{grid-template-columns:1fr}.date-tools-row .jalali-picker{width:100%!important}}

/* V15 — suggested-date panel */


.date-suggestion-box{
  margin-top:8px;padding:0;border:1px solid #9aaeba;border-radius:2px;
  background:#e5e5e5;display:none;overflow:hidden;width:100%;box-sizing:border-box
}
.date-suggestion-title{background:#2d8fbd;color:#fff;font-weight:800;font-size:13px;padding:6px 9px;text-align:right}
.date-suggestion-note{background:#f3f3f3;color:#555;font-size:10px;padding:5px 9px;text-align:right;border-bottom:1px solid #c5cdd2}
.suggested-date-row{
 display:grid;grid-template-columns:1fr 125px 72px;gap:6px;align-items:center;
 min-height:37px;padding:4px 7px;border-bottom:1px solid #c8c8c8;background:#e9e9e9;
 font-size:11px;color:#222;box-sizing:border-box
}
.suggested-date-row .slabel{text-align:right;font-weight:700}
.suggested-date-row input{
 width:100%;height:29px;box-sizing:border-box;background:#fff;border:1px solid #2b8fc0;
 color:#173b55;font:12px Tahoma,Vazirmatn,sans-serif;text-align:center;outline:none
}
.suggested-date-row input:focus{border-color:#d1a82f;box-shadow:0 0 0 1px #d1a82f}
.suggested-date-row .min-note{grid-column:1/-1;text-align:right;color:#8a6b25;font-size:9px;margin-top:-2px}
.suggestion-footer{padding:6px 7px;background:#dedede;color:#665a36;font-size:9px;text-align:right}
.suggestion-actions{display:flex;justify-content:flex-start;gap:6px;padding:6px 7px;background:#dedede}
.suggestion-actions button{
 border:1px solid #2b8fc0;background:#fff;color:#17455f;border-radius:3px;
 padding:5px 10px;font:700 10px Tahoma,Vazirmatn,sans-serif;cursor:pointer
}
.suggestion-actions button.primary{background:#2d8fbd;color:#fff}

.nav{position:relative;z-index:1}
.nav button{
  width:100%;background:transparent;color:#dce8f4;text-align:right;padding:13px 13px;
  border-radius:11px;margin:3px 0;font-size:15px;font-weight:600;transition:.18s;
}
.nav button.active,.nav button:hover{
  background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(225,185,88,.34));
  color:#fff;box-shadow:inset -3px 0 0 var(--gold2);
}
.main{margin-right:250px;width:calc(100% - 250px);padding:24px 34px 35px;position:relative}
.main:before,.main:after{
  content:"";position:absolute;pointer-events:none;z-index:0;opacity:.48;
}
.main:before{
  left:-90px;top:55px;width:300px;height:520px;
  background:
    radial-gradient(ellipse at 58% 18%,rgba(206,160,49,.25) 0 5%,transparent 6%),
    radial-gradient(ellipse at 40% 31%,rgba(206,160,49,.22) 0 6%,transparent 7%),
    radial-gradient(ellipse at 66% 45%,rgba(206,160,49,.20) 0 7%,transparent 8%),
    linear-gradient(72deg,transparent 44%,rgba(206,160,49,.22) 45%,rgba(206,160,49,.06) 47%,transparent 49%);
  filter:blur(.2px);
}
.main:after{
  right:245px;top:70px;width:220px;height:260px;
  background:
    radial-gradient(ellipse at 65% 35%,rgba(206,160,49,.14),transparent 48%),
    radial-gradient(ellipse at 35% 70%,rgba(206,160,49,.11),transparent 45%);
  filter:blur(18px);
}
.top,.cards,.layout,.panel{position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.top h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.3px}
.date{color:var(--muted);font-size:13px}
.actions{display:flex;gap:9px;align-items:center}
.btn{
  padding:10px 16px;border-radius:10px;background:#fffdf9;border:1px solid var(--line);
  color:var(--navy);font-weight:700;font-size:14px;box-shadow:0 2px 9px rgba(20,44,66,.03);
}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.green{background:var(--teal);color:#fff}
.search{
  border:1px solid #e2dccf;border-radius:11px;padding:10px 13px;width:260px;
  background:rgba(255,255,255,.82);color:var(--text);outline:none
}
.search:focus{border-color:var(--gold)}

.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:18px}
.card{
  background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:16px;
  padding:17px;box-shadow:var(--shadow);min-height:92px
}
.card .n{font-size:29px;font-weight:800;line-height:1.2}
.card small{color:#68798a;font-size:13px;font-weight:600}
.card:nth-child(1){border-top:3px solid #9b9da1}
.card:nth-child(2){border-top:3px solid var(--purple)}
.card:nth-child(3){border-top:3px solid var(--blue)}
.card:nth-child(4){border-top:3px solid var(--red)}
.card:nth-child(5){border-top:3px solid var(--teal)}

.layout{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
.panel{
  background:rgba(255,253,249,.94);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:20px
}
.panel h2{font-size:20px;margin:0 0 16px;font-weight:800}

.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eee9df}
.task:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.red{background:var(--red)}.orange{background:var(--orange)}.yellow{background:#d4a62e}.blue{background:var(--blue)}
.task b{font-size:15px}.task span{display:block;color:var(--muted);font-size:13px}
.tx{
  display:grid;grid-template-columns:1.25fr .8fr .8fr .8fr auto;align-items:center;
  gap:12px;padding:15px 0;border-bottom:1px solid #eee9df;font-size:14px
}
.tx:last-child{border:0}
.tx span{color:var(--muted)}
.badge{
  font-size:12px;padding:5px 10px;border-radius:999px;background:#eef5fb;
  color:var(--blue);white-space:nowrap;font-weight:700
}
.empty{padding:35px;text-align:center;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(9,25,40,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.dialog{
  background:#fffdf9;border-radius:20px;width:min(780px,100%);max-height:90vh;overflow:auto;
  padding:25px;border:1px solid var(--line);box-shadow:0 25px 80px rgba(0,0,0,.18)
}
.dialog h2{margin-top:0;font-size:24px}
.close{float:left;background:#f1eee7;padding:7px 11px;border-radius:9px;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{margin-bottom:13px}
.field label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #ded8ca;border-radius:10px;padding:11px;background:#fff;
  color:var(--text);outline:none
}
.field input:focus,.field select:focus{border-color:var(--gold)}

.workflow{margin-top:17px}
.stage{border:1px solid var(--line);border-radius:13px;margin:10px 0;overflow:hidden;background:#fff}
.stagehead{
  padding:13px 15px;background:linear-gradient(90deg,#fbfaf6,#f4f7fa);
  display:flex;justify-content:space-between;align-items:center
}
.stagehead strong{font-size:15px}.progress{font-size:13px;color:var(--muted)}
.sub{padding:9px 15px;display:flex;gap:10px;align-items:center;font-size:14px;border-top:1px solid #f1eee8}
.sub input{accent-color:var(--teal);width:16px;height:16px}
.toast{position:fixed;bottom:22px;left:22px;background:var(--navy);color:#fff;padding:12px 17px;border-radius:11px;display:none;z-index:20;box-shadow:var(--shadow)}
.mobile-nav{display:none}

/* Dashboard visual helpers */
.dashboard-hero{
  min-height:170px;border-radius:18px;border:1px solid var(--line);background:
  linear-gradient(110deg,rgba(255,253,249,.96),rgba(250,246,234,.92));
  padding:20px;position:relative;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)
}
.dashboard-hero:after{
  content:"";position:absolute;left:-15px;bottom:-55px;width:280px;height:210px;
  background:
   radial-gradient(ellipse at 65% 30%,rgba(201,151,43,.30) 0 5%,transparent 6%),
   radial-gradient(ellipse at 42% 52%,rgba(201,151,43,.23) 0 7%,transparent 8%),
   radial-gradient(ellipse at 73% 70%,rgba(201,151,43,.19) 0 6%,transparent 7%),
   linear-gradient(25deg,transparent 46%,rgba(201,151,43,.28) 47%,transparent 49%);
  transform:rotate(-8deg);opacity:.85
}
.hero-title{font-size:23px;font-weight:800;position:relative;z-index:1}
.hero-sub{color:var(--muted);position:relative;z-index:1;font-size:14px}
.routine-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;position:relative;z-index:1}
.routine{
  border:1px solid transparent;border-radius:14px;padding:14px;text-align:center;font-weight:700;
  min-height:92px;display:flex;align-items:center;justify-content:center;transition:.18s
}
.routine:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(25,52,76,.08)}
.r1{background:#edf8f6;color:#137f69}.r2{background:#fff3e4;color:#a66513}.r3{background:#f2edff;color:#6344b8}
.r4{background:#edf5fd;color:#1767a9}.r5{background:#eef8ed;color:#27814e}.r6{background:#eaf5ff;color:#1877bd}
.r7{background:#fff0ee;color:#c4443d}.r8{background:#fff7e8;color:#ad7914}

@media(max-width:1100px){
  .cards{grid-template-columns:repeat(3,1fr)}
  .routine-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:950px){
  .side{display:none}.main{margin:0;width:100%;padding:18px 14px 82px}
  .cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}
  .tx{grid-template-columns:1fr auto}.tx>*:nth-child(n+3){display:none}
  .grid2{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}
  .search{width:180px}.routine-grid{grid-template-columns:repeat(2,1fr)}
  .mobile-nav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fffdf9;border-top:1px solid var(--line);z-index:6}
  .mobile-nav button{flex:1;padding:11px;background:#fffdf9;color:var(--muted);font-size:12px}
}
@media(max-width:560px){
  .cards{grid-template-columns:1fr 1fr}.top{display:block}.actions{margin-top:10px}
  .search{width:100%}.actions .btn{flex:1}.routine-grid{grid-template-columns:1fr 1fr}
}

.jalali-input-wrap{position:relative;display:flex;align-items:center}
.jalali-input-wrap input{padding-left:48px!important;cursor:pointer;background:#fff}
.calendar-btn{position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:9px;background:var(--gold-soft);color:var(--navy);font-size:18px}
.jalali-picker{position:relative;margin-top:7px;width:100%;background:#fffdf9;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px rgba(15,53,88,.16);padding:13px;z-index:20}
.jp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.jp-title{text-align:center;font-weight:800;color:var(--navy);font-size:15px}
.jp-nav{width:32px;height:32px;border-radius:8px;background:#f3efe5;color:var(--navy);font-weight:800}
.jp-week,.jp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.jp-week div{text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:3px}
.jp-day{height:34px;border-radius:8px;background:#fff;border:1px solid transparent;color:var(--text);font-size:12px}
.jp-day:hover{background:var(--gold-soft);border-color:var(--gold2)}
.jp-day.today{border-color:var(--gold);font-weight:800}
.jp-day.selected{background:var(--navy);color:#fff}
.jp-day.empty{visibility:hidden}
.jp-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.jp-today{font-size:11px;color:var(--blue);font-weight:800}
.jp-close{font-size:11px;color:var(--muted);background:transparent}

<div class="app">
<aside class="side">
  <div class="brand">دستیار کمیسیون معاملات<small>کاربر: متین</small></div>
  <div class="nav">
    <button class="active" onclick="showPage('dashboard')">⌂ داشبورد</button>

    <button onclick="showPage('tasks')">کارهای من</button>

</div>
<div class="mobile-nav">
<button onclick="showPage('dashboard')">⌂<br>خانه</button><button onclick="showPage('all')">▤<br>معاملات</button><button onclick="showPage('tasks')">✓<br>کارها</button><button onclick="openNew()">＋<br>جدید</button>
</div>

<script>
const KEY='yar-komision-v1';
const workflows={
'مزایده':[

function loadDB(){
 try{
   let raw=null;
   try{const req=new XMLHttpRequest();req.open('GET','/api/state',false);req.send();if(req.status===200)raw=JSON.parse(req.responseText)}catch(e){}
   const legacy=JSON.parse(localStorage.getItem(KEY)||'{"transactions":[],"tasks":[]}');
   if(!raw || (Array.isArray(raw.transactions)&&raw.transactions.length===0&&Array.isArray(legacy.transactions)&&legacy.transactions.length>0)){
     raw=legacy;
     try{const req=new XMLHttpRequest();req.open('POST','/api/state',false);req.setRequestHeader('Content-Type','application/json');req.send(JSON.stringify(raw))}catch(e){}
   }
   return {transactions:Array.isArray(raw?.transactions)?raw.transactions:[],tasks:Array.isArray(raw?.tasks)?raw.tasks:[]};
 }catch(e){
   console.warn('Local data could not be parsed; starting with a safe empty database.',e);
   return {transactions:[],tasks:[]};
 }
}

 db.transactions.forEach(t=>{

     if(iso){t.dateISO=iso; changed=true;}
   }
   if(t.dateISO && t.date!==t.dateISO){t.date=t.dateISO; changed=true;}
   if(t.dateISO){const j=isoToJalali(t.dateISO); if(j && t.dateJalali!==j){t.dateJalali=j; changed=true;}}
 });
 if(changed)save();
}

function normalizeDigits(s){return String(s??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}
function canonicalJDate(s){
 const x=normalizeDigits(s).trim().replace(/[-.]/g,'/').split('/');
 if(x.length!==3)return null;
 const y=Number(x[0]),m=Number(x[1]),d=Number(x[2]);
 if(!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)||y<1200||m<1||m>12||d<1||d>31)return null;
 const max=jDays(y,m);
 if(d>max)return null;
 return {y,m,d,ascii:`${String(y).padStart(4,'0')}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`,display:jd(y,m,d)};
}
function jalaliToISO(s){
 const d=canonicalJDate(s); if(!d)return null;
 const g=jalaliToGregorian(d.y,d.m,d.d);
 return `${g.getUTCFullYear()}-${String(g.getUTCMonth()+1).padStart(2,'0')}-${String(g.getUTCDate()).padStart(2,'0')}T00:00:00.000Z`;
}
function isoToJalali(iso){
 const g=new Date(iso); if(Number.isNaN(g.getTime()))return null;
 const p=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric',timeZone:'UTC'}).formatToParts(g);
 const y=Number(p.find(x=>x.type==='year')?.value),m=Number(p.find(x=>x.type==='month')?.value),d=Number(p.find(x=>x.type==='day')?.value);
 return Number.isFinite(y)&&Number.isFinite(m)&&Number.isFinite(d)?jd(y,m,d):null;
}
function faDate(value){
 if(!value)return '—';
 const s=String(value);
 const j=canonicalJDate(s);
 if(j)return j.display;
 const jj=isoToJalali(s);
 return jj||'—';
}

/* Exact Jalali -> Gregorian conversion (jalaali algorithm). */
function jalCal(jy){
 const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
 let gy=jy+621, leapJ=-14,jp=breaks[0],jump=0;
 for(let i=1;i<breaks.length;i++){
   const jm=breaks[i],jump=jm-jp;
   if(jy<jm) break;
   leapJ += Math.floor(jump/33)*8 + Math.floor((jump%33)/4);
   jp=jm;
 }
 let n=jy-jp;
 leapJ += Math.floor(n/33)*8 + Math.floor(((n%33)+3)/4);
 if(jump%33===4 && jump-n===4) leapJ++;
 const leapG=Math.floor(gy/4)-Math.floor((Math.floor(gy/100)+1)*3/4)-150;
 const march=20+leapJ-leapG;
 return {gy,march};
}
function jalaliToGregorian(jy,jm,jd0){
 const c=jalCal(jy),gy=c.gy,march=c.march;
 const days=(jm<=7)?((jm-1)*31+(jd0-1)):((jm-1)*30+6+(jd0-1));
 const g=new Date(Date.UTC(gy,2,march));
 g.setUTCDate(g.getUTCDate()+days);
 return g;
}
function jWeek(y,m,d){
 const g=jalaliToGregorian(y,m,d);
 /* JS Sunday=0; convert to Persian week Saturday=0. */
 return (g.getUTCDay()+1)%7;
}
function jDays(y,m){
 if(m<=6)return 31;
 if(m<=11)return 30;
 /* Test whether Esfand 30 converts to a valid next-year date. */
 const g30=jalaliToGregorian(y,12,30);
 const p=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(g30);
 const yy=+p.find(z=>z.type==='year').value,mm=+p.find(z=>z.type==='month').value,dd=+p.find(z=>z.type==='day').value;
 return yy===y&&mm===12&&dd===30 ? 30 : 29;
}

function jDateTimeToMs(dateStr,timeStr='00:00'){
 const d=parseJDate(dateStr);
 if(!d)return NaN;
 const tm=String(timeStr||'00:00').split(':');
 const hh=Number(tm[0]), mm=Number(tm[1]);
 if(!Number.isFinite(hh)||!Number.isFinite(mm)||hh<0||hh>23||mm<0||mm>59)return NaN;
 const g=jalaliToGregorian(d.y,d.m,d.d);
 // Suggested dates are entered in Tehran local time.
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tehran',timeZoneName:'longOffset',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(g);
 const tz=parts.find(x=>x.type==='timeZoneName')?.value||'GMT+03:30';
 const m=tz.match(/GMT([+-])(\d{2}):(\d{2})/);
 const offset=m?((m[1]==='-'?-1:1)*(Number(m[2])*60+Number(m[3]))):210;

}
function addJMinutes(dateStr,timeStr,minutes){
 const ms=jDateTimeToMs(dateStr,timeStr);
 if(!Number.isFinite(ms))return {date:dateStr,time:timeStr};
 const g=new Date(ms+minutes*60000);
 const p=new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(g);
 const y=+p.find(z=>z.type==='year').value,m=+p.find(z=>z.type==='month').value,d=+p.find(z=>z.type==='day').value;
 const hh=String(g.getUTCHours()).padStart(2,'0'),mm=String(g.getUTCMinutes()).padStart(2,'0');
 return {date:jd(y,m,d),time:`${hh}:${mm}`};
}
function minSuggestionRows(base,type){
 const docsDate=addJDays(base.y,base.m,base.d,3), docsTime='15:00';
 // Core rule used by this workflow: the interval from the final document deadline
 // to the final bid deadline must be at least 10 full days, including the time.
 const offer=addJMinutes(docsDate,docsTime,10*24*60);
 const opening=addJMinutes(offer.date,offer.time,30);
 const winner=addJMinutes(opening.date,opening.time,5);
 const rows=[];
 if(type==='مزایده') rows.push({key:'بازدید',label:'مهلت بازدید',date:docsDate,time:docsTime});
 rows.push({key:'اسناد',label:'مهلت دریافت اسناد',date:docsDate,time:docsTime});
 rows.push({key:'پیشنهاد',label:'مهلت ارائه پیشنهاد',date:offer.date,time:offer.time});
 rows.push({key:'بازگشایی',label:'زمان بازگشایی',date:opening.date,time:opening.time});
 rows.push({key:'برنده',label:'زمان اعلام برنده',date:winner.date,time:winner.time});

}
function minForSuggestedRow(rows,index){
 const r=rows[index];
 if(!r)return null;
 if(r.key==='اسناد' || r.key==='بازدید') return {date:r.date,time:r.time};
 const docs=rows.find(x=>x.key==='اسناد');
 if(!docs)return null;
 if(r.key==='پیشنهاد') return addJMinutes(docs.date,docs.time,10*24*60);
 const offer=rows.find(x=>x.key==='پیشنهاد');
 if(r.key==='بازگشایی' && offer){
   const offerDate=document.getElementById('suggestDate_'+rows.indexOf(offer))?.value||offer.date;
   const offerTime=document.getElementById('suggestTime_'+rows.indexOf(offer))?.value||offer.time;
   return addJMinutes(offerDate,offerTime,30);
 }
 if(r.key==='برنده'){
   const opening=rows.find(x=>x.key==='بازگشایی');
   if(opening){
     const openingDate=document.getElementById('suggestDate_'+rows.indexOf(opening))?.value||opening.date;
     const openingTime=document.getElementById('suggestTime_'+rows.indexOf(opening))?.value||opening.time;
     return addJMinutes(openingDate,openingTime,5);
   }
 }
 return {date:r.date,time:r.time};
}

function confirmSuggestedDates(){

function taskDueMs(t,s,si,ii){
  const it=s.items[ii];
  if(it&&it.dueAt){const x=new Date(it.dueAt).getTime();if(Number.isFinite(x))return x;}
  const rows=t.suggestedDates||[];
  const rowByKey=k=>rows.find(r=>r.key===k);
  const name=String(it?.name||'');
  let row=null, offset=0;
  if(/دعوت به جلسه اعضای کمیسیون/.test(name)){ row=rowByKey('بازگشایی'); offset=-3*86400000; }
  else if(/دعوت به جلسه سازمان بازرسی/.test(name)){ row=rowByKey('بازگشایی'); offset=-3*86400000; }
  else if(/اصل سپرده/.test(name)){ row=rowByKey('بازگشایی'); offset=name.includes('۱ روز')?-86400000:0; }
  else {
    const keyMap={'بازدید':'بازدید','اسناد':'اسناد','پیشنهاد':'پیشنهاد','بازگشایی':'بازگشایی','برنده':'برنده'};
    const key=Object.keys(keyMap).find(k=>name.includes(k));
    if(key)row=rowByKey(keyMap[key]);
  }
  if(row){
    const base=jDateTimeToMs(row.date,row.time);
    return Number.isFinite(base)?base+offset:null;
  }
  return null;
}

   return `<div class="stage ${complete?'complete ':''}${isOpen?'open':''}" id="stage_${si}">`+
   `<div class="stagehead" onclick="toggleStage(${t.id},${si})"><div class="stagehead-main"><span class="stage-chevron" id="chev_${si}">${isOpen?'⌄':'›'}</span><strong>${si+1}. ${esc(s.name)}</strong></div><span class="progress">${complete?'✓ ':''}${done} / ${s.items.length} انجام شده</span></div>`+
   `<div class="stage-body">${s.items.map((it,ii)=>`<label class="sub"><input type="checkbox" ${it.done?'checked':''} onchange="toggleItem(${t.id},${si},${ii})"><span>${esc(it.name)}${it.dueAt?` <small style="color:var(--muted)">· ${faDate(new Date(it.dueAt).toISOString())}</small>`:''}</span></label>`).join('')}</div></div>`;
 }).join('');
 document.getElementById('content').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start"><div><span class="badge">${esc(t.type)}</span><h2 style="margin-top:9px">${esc(t.subject)}</h2><div class="date">شماره: ${esc(t.ref||'—')} · تاریخ: ${faDate(t.date)} · واحد: ${esc(t.unit||'—')}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" onclick="showPage('all')">بازگشت</button><button class="btn" style="background:#fff0f0;color:#c73535;border-color:#f0caca" onclick="deleteTx(${t.id})">🗑 حذف معامله</button></div></div><div class="workflow">${body}</div><div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="addCustomStage(${t.id})">＋ مرحله سفارشی</button><button class="btn green" onclick="archiveTx(${t.id})">★ ثبت در بایگانی</button></div></div>`;
}

function toggleItem(id,si,ii){
 let t=db.transactions.find(x=>x.id===id);if(!t||!t.stages?.[si]?.items?.[ii])return;
 let item=t.stages[si].items[ii];item.done=!item.done;
 let s=t.stages[si],complete=s.items.length>0&&s.items.every(i=>i.done);
 if(complete){
   if(si===t.stages.length-1 && /ثبت در بایگانی/.test(s.name)){
     t.archived=true;t.status='بایگانی';save();toast('معامله بایگانی شد');showPage('archive');return;
   }
   if(si<t.stages.length-1)t.stage=Math.max(t.stage||0,si+1);
 }else if((t.stage||0)>si){
   t.stage=si;
 }
 save();showTransaction(id);
}
function addCustomStage(id){let t=db.transactions.find(x=>x.id===id);let title=prompt('عنوان مرحله سفارشی را وارد کنید:');if(!title)return;let note=prompt('یادداشت کوتاه (اختیاری):')||'';let due=prompt('موعد یادآوری (اختیاری) به میلادی ISO، مثال 2026-10-05T15:00:00');let dueAt=due&&Number.isFinite(new Date(due).getTime())?new Date(due).toISOString():null;t.stages.splice(t.stage+1,0,{name:title,items:[{name:note?`یادداشت: ${note}`:'انجام مرحله',done:false,dueAt}],custom:true});save();showTransaction(id)}
function deleteTx(id){
 let t=db.transactions.find(x=>x.id===id);
 if(!t)return;
 if(confirm(`معامله «${t.subject}» برای همیشه حذف شود؟`)){
   db.transactions=db.transactions.filter(x=>x.id!==id);
   save(); selected=null; toast('معامله حذف شد'); showPage('all');
 }
}
function archiveTx(id){let t=db.transactions.find(x=>x.id===id);if(!t)return;if(confirm('این معامله به بایگانی منتقل شود؟')){t.archived=true;t.status='بایگانی';save();toast('معامله بایگانی شد');showPage('archive')}}
function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yar-komision-backup.json';a.click();URL.revokeObjectURL(a.href)}
function clearDB(){if(confirm('تمام داده‌های محلی حذف شود؟')){db={transactions:[],tasks:[]};save();render()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();


/* Real browser reminder engine: runs while this page is open. */
let alarmTimer=null;
const ALARM_KEY='yar-komision-fired-alarms-v1';
function alarmStore(){try{return JSON.parse(localStorage.getItem(ALARM_KEY)||'{}')}catch(e){return {}}}
function saveAlarmStore(x){localStorage.setItem(ALARM_KEY,JSON.stringify(x))}
function alarmEvents(){
 const out=[];
 const add=(id,t,at,label)=>{if(Number.isFinite(at))out.push({id:t.id+'|'+id,tx:t,at,label});};
 db.transactions.filter(t=>!t.archived).forEach(t=>{
   if(t.date){const base=new Date(t.date).getTime();if(Number.isFinite(base)){
     add('publication|day',t,base,'روز انتشار / شروع معامله');
     add('publication|minus1',t,base-86400000,'۱ روز مانده به انتشار / شروع معامله');
   }}
   (t.suggestedDates||[]).forEach(r=>{
     const base=jDateTimeToMs(r.date,r.time); if(!Number.isFinite(base))return;
     if(r.key==='بازگشایی'){
       add('opening|3d',t,base-3*86400000,'۳ روز مانده به بازگشایی — دعوت اعضای کمیسیون و سازمان بازرسی');
       add('opening|24h',t,base-86400000,'۲۴ ساعت مانده به بازگشایی');
       add('opening|2h',t,base-7200000,'۲ ساعت مانده به بازگشایی');
       add('opening|now',t,base,'زمان بازگشایی');
       add('deposit|1d',t,base-86400000,'۱ روز مانده به بازگشایی — کنترل اصل سپرده');
       add('deposit|now',t,base,'روز بازگشایی — کنترل اصل سپرده');
     }else if(r.key==='پیشنهاد'){
       add('offer|2h',t,base-7200000,'۲ ساعت مانده به پایان ارسال پیشنهاد');
       add('offer|now',t,base,'پایان ارسال پیشنهاد');
     }else if(r.key==='اسناد'){
       add('docs|1d',t,base-86400000,'۱ روز مانده به پایان دریافت اسناد');
       add('docs|now',t,base,'پایان دریافت اسناد');
     }else if(r.key==='برنده'){
       add('winner|now',t,base,'زمان اعلام برنده');
     }
   });
   // Custom task reminders persisted directly on task items.
   t.stages.forEach((s,si)=>s.items.forEach((it,ii)=>{
     if(!it.done && it.dueAt){const at=new Date(it.dueAt).getTime(); if(Number.isFinite(at)){
       const identity=si+'|'+ii;
       add('task|'+identity+'|24h',t,at-86400000,'۱ روز مانده — '+it.name);
       add('task|'+identity+'|now',t,at,'موعد کار — '+it.name);
     }}
   }));
 });
 return out;
}

function fireAlarm(ev){
 const msg='⏰ '+ev.label+' — '+(ev.tx.subject||'معامله');
 toast(msg);
 try{if('Notification' in window && Notification.permission==='granted')new Notification('دستیار کمیسیون معاملات',{body:msg});}catch(e){}
 try{const C=window.AudioContext||window.webkitAudioContext;if(C){const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close()},220);}}catch(e){}
}
function checkAlarms(){
 const store=alarmStore(),now=Date.now();let changed=false;
 alarmEvents().forEach(ev=>{if(ev.at<=now&&now-ev.at<36*3600000&&!store[ev.id]){store[ev.id]=now;changed=true;fireAlarm(ev)}});
 if(changed)saveAlarmStore(store);
}
function enableAlarms(){
 if(!('Notification' in window)){toast('این مرورگر اعلان دسکتاپ را پشتیبانی نمی‌کند');return;}
 Notification.requestPermission().then(p=>{if(p==='granted'){toast('آلارم‌ها فعال شدند');checkAlarms()}else toast('اجازه اعلان داده نشد')});
}
function startAlarmEngine(){if(alarmTimer)clearInterval(alarmTimer);checkAlarms();alarmTimer=setInterval(checkAlarms,30000)}

document.addEventListener('input',function(e){
 if(e.target && e.target.id==='newDate') refreshSuggestedDates();
});
document.addEventListener('change',function(e){
 if(e.target && e.target.id==='newDate') refreshSuggestedDates();
 if(e.target && (e.target.id==='newType'||e.target.id==='routineType')) refreshSuggestedDates();
});


document.addEventListener('change',function(e){
 if(e.target && (e.target.id==='routineType'||e.target.id==='newType'||e.target.id==='newDate')){
   setTimeout(showSuggestedDates,0);
 }
});
startAlarmEngine();
</script>
</body></html>
